version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flashsale
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api1: &api-template
    build: .
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASS=password
      - DB_NAME=flashsale
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  api2:
    <<: *api-template
  api3:
    <<: *api-template

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - api1
      - api2
      - api3