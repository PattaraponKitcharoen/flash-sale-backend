worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    access_log off;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000000;

    # API responses are small JSON; gzip would only burn CPU.
    gzip off;

    upstream backend_servers {
        # Requests have two very different latency classes (cached GET ~2ms vs
        # queued POST ~15ms), so pick the instance with the fewest live
        # connections instead of blind round robin.
        least_conn;

        # max_fails=0 keeps Nginx from evicting an instance during the load
        # test: 409 (duplicate) and 410 (sold out) are expected business
        # responses, not upstream failures.
        server api1:3000 max_fails=0;
        server api2:3000 max_fails=0;
        server api3:3000 max_fails=0;

        keepalive 128;
        keepalive_requests 1000000;
        keepalive_timeout 60s;
    }

    server {
        listen 80 backlog=8192 reuseport;
        server_name _;

        # Read-heavy: payload is a page of products, buffering helps.
        location = /api/v1/products {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering on;
            proxy_buffers 8 8k;
        }

        # Write-heavy: tiny 202 body, every millisecond of buffering is waste.
        location = /api/v1/orders {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
